name: Instagram トークン更新

on:
  schedule:
    - cron: "0 18 * * 0"   # 毎週月曜 3:00（日本時間）
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install requests

      - name: トークンを更新して Secrets に保存
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          NEW_TOKEN="$(python refresh_token.py)"
          echo "::add-mask::$NEW_TOKEN"
          gh secret set IG_ACCESS_TOKEN --body "$NEW_TOKEN" --repo "$GITHUB_REPOSITORY"

      # 60日間コミットがないとGitHubが定期実行を止めるため、週1回だけ記録を残す
      - name: 定期実行の維持
        run: |
          git config user.name  "x2ig-bot"
          git config user.email "x2ig-bot@users.noreply.github.com"
          date -u +%Y-%m-%dT%H:%M:%SZ > .keepalive
          git add .keepalive
          git commit -m "keepalive"
          git pull --rebase
          git push
