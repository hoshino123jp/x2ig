name: 定期実行の維持

on:
  schedule:
    - cron: "0 18 * * 0"   # 毎週月曜 3:00（日本時間）
  workflow_dispatch:

permissions:
  contents: write

jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 60日間コミットがないとGitHubが定期実行を止めるため、週1回だけ記録を残す
      # ※Instagramのトークン（60日）は、期限前にMeta Business Suiteで手動で作り直してください
      - name: 定期実行の維持
        run: |
          git config user.name  "x2ig-bot"
          git config user.email "x2ig-bot@users.noreply.github.com"
          date -u +%Y-%m-%dT%H:%M:%SZ > .keepalive
          git add .keepalive
          git commit -m "keepalive"
          git pull --rebase
          git push
